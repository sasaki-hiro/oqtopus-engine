name: build

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          cd core
          docker build -f Dockerfile.dev -t oqtopus-dev_qulacs .

      - name: Save image
        run: |
          docker save oqtopus-dev_qulacs | gzip > oqtopus-dev_qulacs.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oqtopus-dev_qulacs
          path: oqtopus-dev_qulacs.tar.gz
